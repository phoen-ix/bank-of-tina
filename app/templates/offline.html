<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Offline') }} — Bank of Tina</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f9fa;
            color: #212529;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: {{ theme_navbar }};
        }
        p {
            font-size: 1rem;
            color: #6c757d;
            max-width: 320px;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        a.retry {
            display: inline-block;
            text-decoration: none;
            background: {{ theme_navbar }};
            color: #fff;
            border: none;
            border-radius: 0.375rem;
            padding: 0.625rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        a.retry:hover { filter: brightness(0.9); }
        .app-name {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="icon">🏦</div>
    <h1>{{ _("You're offline") }}</h1>
    <p>{{ _('Bank of Tina needs a network connection to load. Check your network and try again.') }}</p>
    {# A plain link: the page is served with a CSP that blocks inline handlers. #}
    <a class="retry" href="/">{{ _('Retry') }}</a>
    <div class="app-name">Bank of Tina</div>
</body>
</html>
