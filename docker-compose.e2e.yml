# Throwaway stack for the docs tour (scripts/docs-screenshots.sh) and the e2e
# suite (scripts/e2e.sh): its own container names, named volumes instead of the
# checkout's ./mariadb-data, ./uploads, ./backups and ./icons, and the web port
# on 127.0.0.1:${PORT_BASE:-24100}. The e2e suite adds Mailpit (profile `mail`,
# web/API on 127.0.0.1:${MAILPIT_PORT:-8025}). Always under its own project name:
#
#   COMPOSE_PROJECT_NAME=bank-of-tina_docs \
#     docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
#
# Tear down with the same files and `down -v --remove-orphans --rmi local`.
services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME:?}-db
    restart: "no"
    volumes: !override
      - db-data:/var/lib/mysql

  web:
    container_name: ${COMPOSE_PROJECT_NAME:?}-web
    restart: "no"
    ports: !override
      - "127.0.0.1:${PORT_BASE:-24100}:5000"
    volumes: !override
      - uploads:/uploads
      - backups:/backups
      - icons:/app/static/icons
    # The image's healthcheck polls every 30 s; `up --wait` should not idle that long.
    healthcheck:
      interval: 2s
      retries: 30

  # SMTP sink for the e2e suite (scripts/e2e.sh sets COMPOSE_PROFILES=mail):
  # host `mailpit`, port 1025, no TLS, any user/password.
  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: [mail]
    container_name: ${COMPOSE_PROJECT_NAME:?}-mailpit
    restart: "no"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
  uploads:
  backups:
  icons:
