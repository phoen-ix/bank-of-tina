# Lint and format config only (the app is not a package): ruff check . && ruff format --check .
[tool.ruff]
target-version = "py315"
line-length = 120
src = ["app"]  # the app's modules import each other by bare name
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code at 120; long strings stay

[tool.ruff.format]
quote-style = "preserve"
