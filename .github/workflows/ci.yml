name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so new advisories for unchanged dependencies are noticed too.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docker/requirements*.txt

      - name: Install
        run: pip install -r docker/requirements-dev.txt

      - name: Test
        run: python -m pytest

      # The installed environment, not pip-audit's own dependencies: freeze first,
      # then run pip-audit through pipx (preinstalled on the runners).
      - name: Audit dependencies
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-frozen.txt"
          pipx run pip-audit -r "$RUNNER_TEMP/requirements-frozen.txt" --no-deps --disable-pip --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t bank-of-tina:ci .

      # The backup/restore code shells out to these; make sure the image has them.
      - name: Check database client tools
        run: docker run --rm --entrypoint sh bank-of-tina:ci -c 'command -v mariadb && command -v mariadb-dump && mariadb --help | grep -q -- --sandbox'
