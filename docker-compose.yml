services:
  db:
    image: mariadb:12.3.3
    container_name: bank-of-tina-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE:      ${DB_NAME:-bank_of_tina}
      MYSQL_USER:          ${DB_USER:-tina}
      MYSQL_PASSWORD:      ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Upgrade an existing data directory in place when the image moves to a newer major (dump first).
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: .
    container_name: bank-of-tina
    ports:
      # Localhost only by default. The app has no login: expose it through an
      # authenticating reverse proxy, or set BIND_ADDRESS=0.0.0.0 in .env to
      # reach it directly from a trusted LAN.
      - "${BIND_ADDRESS:-127.0.0.1}:5000:5000"
    volumes:
      - ./uploads:/uploads
      - ./backups:/backups
      - ./icons:/app/static/icons
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-bank_of_tina}
      - DB_USER=${DB_USER:-tina}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
